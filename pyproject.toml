[project]
name = "MonbotLauncher"
version = "1.10.0"
description = "MonbotLauncher - QQ机器人，基于 NoneBot2 和 MonCore 后端"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "nonebot2[fastapi,aiohttp]>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
    "websockets>=11.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "watchfiles>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["MonBot"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["MonQQBotCore/MonBot/src/plugins"]
builtin_plugins = []

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
